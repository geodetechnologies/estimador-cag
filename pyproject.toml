[project]
name = "estimador-cag"
version = "0.1.0"
description = "Static-context software estimation API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "openai",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["."]
