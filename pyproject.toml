[project]
name = "estimador-cag"
version = "0.1.0"
description = "Static-context software estimation API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "openai",
    "python-dotenv",
    "streamlit>=1.41,<2",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<1",
    "pypdf>=7.0.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["."]
